[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "co-scientist-engine"
version = "0.2.0"
description = "Open LangGraph-based framework for multi-agent research hypothesis generation, adapted from Google Research's AI Co-Scientist."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["ai", "research", "hypothesis", "langgraph", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "langgraph~=1.0.6",
    "langchain-core~=1.3.3",
    # Pinned to the compatible-release granularity every other dependency
    # here uses (N18) -- an unbounded lower-only range let a fresh resolve
    # pick up a future major with no local signal that anything changed.
    "langchain-mcp-adapters~=0.3.0",
    # Pinned below 2.0 because langchain-mcp-adapters asks only for
    # `mcp>=1.24.0`: mcp 2.0.0 moved `RequestContext` out of
    # `mcp.shared.context`, which the adapter imports at module scope, so a
    # fresh resolve took the new major and every import of this package --
    # hence the whole app -- died on ImportError. Raise this only together
    # with an adapter release that supports the new major.
    "mcp>=1.24.0,<2",
    "litellm~=1.80.16",
    "httpx~=0.28.1",
    "typing-extensions~=4.15.0",
    "jsonschema~=4.26.0",
    "pyyaml~=6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest~=9.0.2",
    "pytest-asyncio~=1.3.0",
    "pytest-cov>=7.0",
    "ruff==0.15.21",  # pinned: must match the ruff pin in .github/workflows/ci.yml
                      # (a floating ruff reformats on release and reds `make lint`)
    "mypy~=1.19.1",
    "types-PyYAML",
    "types-jsonschema",
    "python-dotenv~=1.2.1",
    "absl-py~=2.1",
    "rich~=14.2.0",
]


[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["co_scientist*"]

[tool.setuptools.package-data]
co_scientist = ["prompts/templates/*.md", "config/*.yaml", "config/examples/*.yaml", "sandbox/*.sbpl", "py.typed"]

[tool.ruff]
line-length = 80
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
    "C90", # mccabe (cyclomatic complexity)
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
    "D",   # pydocstyle
    "PLR0913", # too-many-arguments
]
ignore = [
    # Google-style docstrings use descriptive-mood summaries ("Returns the
    # ...", "Fetches rows ..."), which the imperative-mood check rejects.
    "D401",
]

[tool.ruff.lint.mccabe]
# Every function in this package sits at or below this ceiling. Branch-heavy
# dispatchers belong in a lookup table, not an if/elif chain.
max-complexity = 5

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Test and local-iteration scripts are not public API; their names are
# self-describing, so docstrings are not required.
"tests/**" = ["D1"]
"mcp_server/tests/**" = ["D1"]
# dev/ and examples/ load .env files and tweak sys.path before imports.
"dev/**" = ["D1", "E402"]
"examples/**" = ["D1", "E402"]
# server.py loads its co-located .env and configures logging before importing
# tool modules, which read env vars (e.g. ENTREZ_EMAIL) at import time.
"mcp_server/server.py" = ["E402"]

# --- PLR0913 (max 5 arguments) exemption ---
# One permanent kind. Everything else in this package is at or below the
# ceiling; past five arguments, group the cohesive ones into a frozen
# dataclass (see CompletionSpec, GeneratorOptions, PromptRunContext,
# _SearchRunContext for the pattern).
#
# FastMCP derives each tool's advertised parameter schema from its
# signature, so a registered tool's arguments ARE its wire contract and
# cannot be bundled without changing what agents see. Only the two modules
# whose registered tool exceeds five arguments are listed; their private
# helpers were refactored normally and stay under the ceiling.
"mcp_server/tools/indra_cogex/enrichment.py" = ["PLR0913"]
"mcp_server/tools/indra_cogex/statements.py" = ["PLR0913"]

[tool.mypy]
python_version = "3.10"
strict = true
# mcp_server is a separate package with its own mypy config (it needs the
# Bio.* override); check it from its own directory. dev/ holds local
# standalone iteration scripts that are not part of the shipped package.
exclude = ["^(dev|mcp_server|build|dist)/"]

[[tool.mypy.overrides]]
module = ["jsonschema", "jsonschema.*", "yaml"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
