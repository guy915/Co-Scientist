[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "co-scientist-engine"
version = "0.2.0"
description = "Open LangGraph-based framework for multi-agent research hypothesis generation, adapted from Google Research's AI Co-Scientist."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["ai", "research", "hypothesis", "langgraph", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "langgraph~=1.0.6",
    "langchain-core~=1.3.3",
    # Bound future major releases while allowing compatible upgrades.
    "langchain-mcp-adapters~=0.3.0",
    # The adapter depends on MCP v1 RequestContext paths; a major upgrade requires coordinated
    # changes.
    "mcp>=1.24.0,<2",
    "litellm~=1.80.16",
    "httpx~=0.28.1",
    "typing-extensions~=4.15.0",
    "jsonschema~=4.26.0",
    "pyyaml~=6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest~=9.0.2",
    "pytest-asyncio~=1.3.0",
    "pytest-cov>=7.0",
    "ruff==0.15.21",  # pinned: must match the ruff pin in .github/workflows/ci.yml
    "mypy~=1.19.1",
    "types-PyYAML",
    "types-jsonschema",
    "python-dotenv~=1.2.1",
    "absl-py~=2.1",
    "import-linter~=2.15",
]


[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["co_scientist*"]

[tool.setuptools.package-data]
co_scientist = ["prompts/templates/*.md", "config/*.yaml", "sandbox/*.sbpl", "py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
    "C90", # mccabe (cyclomatic complexity)
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
# Load dotenv and configure logging before environment-dependent MCP imports.
"mcp_server/server.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
strict = true
# The app's modules move into this package (ADR-001); they need the plugin.
plugins = ["pydantic.mypy"]
# MCP owns independent strict configuration and Biopython overrides.
exclude = ["^(mcp_server|build|dist)/"]

[[tool.mypy.overrides]]
module = ["jsonschema", "jsonschema.*", "yaml", "pypdf", "pypdf.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
