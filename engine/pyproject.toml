[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "co-scientist-engine"
version = "0.2.0"
description = "Open LangGraph-based framework for multi-agent research hypothesis generation, adapted from Google Research's AI Co-Scientist."
readme = "README.md"
requires-python = ">=3.10"
keywords = ["ai", "research", "hypothesis", "langgraph", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "langgraph~=1.0.6",
    "langchain-core~=1.2.7",
    "langchain-mcp-adapters>=0.2.1",
    "langsmith~=0.6.2",
    "litellm~=1.80.16",
    "typing-extensions~=4.15.0",
    "jsonschema~=4.26.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest~=9.0.2",
    "pytest-asyncio~=1.3.0",
    "pytest-cov>=7.0",
    "ruff>=0.15",
    "mypy~=1.19.1",
    "types-PyYAML",
    "types-jsonschema",
    "python-dotenv~=1.2.1",
    "absl-py~=2.1",
    "rich~=14.2.0",
]


[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["co_scientist*"]

[tool.setuptools.package-data]
co_scientist = ["prompts/templates/*.md", "config/*.yaml", "config/examples/*.yaml", "py.typed"]

[tool.ruff]
line-length = 80
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
    "D",   # pydocstyle
]
ignore = [
    # Google-style docstrings use descriptive-mood summaries ("Returns the
    # ...", "Fetches rows ..."), which the imperative-mood check rejects.
    "D401",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Test and local-iteration scripts are not public API; their names are
# self-describing, so docstrings are not required.
"tests/**" = ["D1"]
"mcp_server/tests/**" = ["D1"]
# dev/ and examples/ load .env files and tweak sys.path before imports.
"dev/**" = ["D1", "E402"]
"examples/**" = ["D1", "E402"]
# server.py imports config before the tool modules on purpose: importing
# mcp_server.config loads the co-located .env, and several tool modules read
# those env vars (e.g. ENTREZ_EMAIL) at import time, so the config import and
# the logging setup it configures must run first.
"mcp_server/server.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
strict = true
# mcp_server is a separate package with its own mypy config (it needs the
# Bio.* override); check it from its own directory. dev/ holds local
# standalone iteration scripts that are not part of the shipped package.
exclude = ["^dev/", "^mcp_server/"]

[[tool.mypy.overrides]]
module = ["jsonschema", "jsonschema.*", "yaml"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]