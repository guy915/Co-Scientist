# Co-Scientist Tool Configuration
# Version 1.0
#
# This file defines available MCP servers, tools, and workflow configurations.
# Users can override this by creating ~/.coscientist/tools.yaml
#
# Environment variables can be used with ${VAR} or ${VAR:-default} syntax.

version: "1.0"

# MCP Server Definitions
servers:
  default_pubmed:
    url: "${MCP_SERVER_URL:-http://localhost:8888/mcp}"
    transport: "streamable_http"
    enabled: true

# Tool Definitions
# Organized by category: search_tools, read_tools, utility_tools
tools:
  search_tools:
    # The research group's own papers, held as sanitized full text on the MCP
    # server rather than fetched from a publisher. This is the search half of
    # a search-then-read pair: it returns passages so scoring can discriminate
    # between paragraphs rather than blur whole papers together, and
    # paper_corpus_fetch below reads the winner in full. Silently empty when
    # no corpus is installed, which is the default.
    paper_corpus_search:
      server: "default_pubmed"
      mcp_tool_name: "search_paper_corpus"
      display_name: "Group Paper Corpus"
      description: "Search the research group's own published papers for passages on a topic"
      category: "search"
      source_type: "academic"
      enabled: true

      response_format:
        type: "json"
        results_path: "."
        is_dict: true
        field_mapping:
          title: "title"
          abstract: "abstract"
          source_id: "@key"
          source: "'group_corpus'"

      # The literature-review pipeline calls sources with canonical parameter
      # names, so map them onto this tool's own. Without this the corpus is
      # unusable as a search source: it would be called with `max_papers`,
      # which it does not accept. The rest have no meaning for a local corpus
      # -- there is no run-scoped download directory and nothing to filter by
      # recency, since the group's back catalogue is the point.
      parameter_mapping:
        query: "query"
        max_papers: "max_passages"
        slug: null
        recency_years: null
        run_id: null

      prompt_snippet: |
        Use `search_paper_corpus` to search the user's own research group's published papers.
        - Consult it before external sources when the question touches the group's own methods
          or prior findings; it is the authoritative record of what they have already shown.
        - Returns short passages, each with a `paper_id`. Passages are for locating the right
          paper, not for reading it: when a passage looks relevant but does not settle the
          question, call `fetch_paper(paper_id)` to read the whole thing.
        - Returns nothing when the group has no corpus installed; fall back to PubMed.
        - Example: search_paper_corpus(query="RAF dimerization paradoxical ERK activation")

      parameters:
        query:
          type: "string"
          required: true
          description: "Search terms; technical vocabulary works best"
        max_passages:
          type: "integer"
          default: 5
          description: "Maximum number of passages to return"

    # The read step after the search step, mirroring pubmed_search ->
    # pubmed_fulltext. Papers run 8k-24k tokens, which is a small fraction of
    # the configured models' context, so reading one in full is cheap when a
    # passage is not enough.
    paper_corpus_fetch:
      server: "default_pubmed"
      mcp_tool_name: "fetch_paper"
      display_name: "Group Paper Full Text"
      description: "Read one of the research group's own papers in full, by paper_id"
      category: "search"
      source_type: "academic"
      enabled: true

      response_format:
        type: "json"
        results_path: "."
        is_dict: true
        field_mapping:
          title: "title"
          content: "content"
          source_id: "source_id"
          source: "'group_corpus'"

      prompt_snippet: |
        Use `fetch_paper` to read one of the group's own papers in full.
        - Takes a `paper_id` from a `search_paper_corpus` result.
        - Use it when a passage is promising but incomplete: to check what a method actually
          did, what the controls were, or what the paper concluded rather than claimed.
        - Prefer one fetch of the right paper over many searches of the wrong one.
        - Example: fetch_paper(paper_id="control-of-cell-state-transitions")

      parameters:
        paper_id:
          type: "string"
          required: true
          description: "The paper_id returned by search_paper_corpus"

    # PubMed metadata search (used in draft phase)
    pubmed_search:
      server: "default_pubmed"
      mcp_tool_name: "search_pubmed"
      display_name: "PubMed Search"
      description: "Search PubMed for biomedical papers and return metadata (title, abstract, authors, DOI)"
      category: "search"
      source_type: "academic"
      enabled: true

      response_format:
        type: "json"
        results_path: "."
        is_dict: true
        field_mapping:
          title: "title"
          url: "@url_from_key"
          authors: "authors"
          year: "date_revised|split:/|index:0|int"
          abstract: "abstract"
          source_id: "@key"
          source: "'pubmed'"
          venue: "publication"

      prompt_snippet: |
        Use `search_pubmed` to search PubMed and get paper metadata (title, abstract, authors, DOI).
        - Returns metadata only (abstracts), no fulltext downloads
        - Use boolean operators (AND/OR/NOT) for precise queries
        - Example: search_pubmed(query="CRISPR gene editing AND efficiency NOT bacteria", max_papers=5)

      parameters:
        query:
          type: "string"
          required: true
          description: "PubMed search query with boolean operators"
        max_papers:
          type: "integer"
          default: 10
          description: "Maximum number of papers to return"

    # PubMed fulltext search (used in literature review and validation)
    pubmed_fulltext:
      server: "default_pubmed"
      mcp_tool_name: "pubmed_search_with_fulltext"
      display_name: "PubMed Fulltext Search"
      description: "Search PubMed and download fulltexts from PMC for comprehensive analysis"
      category: "search_with_content"
      source_type: "academic"
      enabled: true

      response_format:
        type: "json"
        results_path: "."
        is_dict: true
        field_mapping:
          title: "title"
          url: "@url_from_key"
          authors: "authors"
          year: "date_revised|split:/|index:0|int"
          abstract: "abstract"
          content: "fulltext"
          source_id: "@key"
          source: "'pubmed'"
          venue: "publication"
          pmc_id: "pmc_full_text_id"

      # PubMed uses canonical parameter names (1:1 mapping)
      parameter_mapping:
        query: "query"
        slug: "slug"
        max_papers: "max_papers"
        recency_years: "recency_years"
        run_id: "run_id"

      prompt_snippet: |
        Use `pubmed_search_with_fulltext` to search PubMed AND download fulltexts from PMC.
        - Downloads full paper content when available via PMC
        - Use for comprehensive literature analysis
        - Example: pubmed_search_with_fulltext(query="...", slug="research_abc", max_papers=5)

      parameters:
        query:
          type: "string"
          required: true
          description: "PubMed search query"
        slug:
          type: "string"
          required: true
          description: "Unique identifier for this research corpus"
        max_papers:
          type: "integer"
          default: 10
          description: "Maximum number of papers to return"
        recency_years:
          type: "integer"
          default: 0
          description: "Filter to papers from last N years (0 = no filter)"
        run_id:
          type: "string"
          required: false
          description: "Optional run ID for tracking"

    openalex_search:
      server: "default_pubmed"
      mcp_tool_name: "search_openalex"
      display_name: "OpenAlex Search"
      description: "Search current cross-disciplinary scholarly works"
      category: "search"
      source_type: "academic"
      enabled: true
      response_format:
        type: "json"
        results_path: "."
        is_dict: true
        field_mapping:
          title: "title"
          url: "url"
          authors: "authors"
          year: "year"
          abstract: "abstract"
          source_id: "@key"
          source: "'openalex'"
      parameter_mapping:
        query: "query"
        slug: null
        max_papers: "max_papers"
        recency_years: "recency_years"
        run_id: "run_id"
      prompt_snippet: |
        Use `search_openalex` for current cross-disciplinary scholarly work.

    chembl_search:
      server: "default_pubmed"
      mcp_tool_name: "search_chembl"
      display_name: "ChEMBL Search"
      description: "Search bioactive molecules and development records"
      category: "search"
      source_type: "scientific_database"
      enabled: true
      parameter_mapping:
        entity_name: "query"
        limit: "max_results"
      prompt_snippet: |
        Use `search_chembl` to verify molecule identity, synonyms, type,
        approval history, and clinical development phase.

    uniprot_search:
      server: "default_pubmed"
      mcp_tool_name: "search_uniprot"
      display_name: "UniProt Search"
      description: "Search reviewed protein functions and identifiers"
      category: "search"
      source_type: "scientific_database"
      enabled: true
      parameter_mapping:
        entity_name: "query"
        limit: "max_results"
      prompt_snippet: |
        Use `search_uniprot` to verify protein names, gene mappings,
        organisms, and reviewed functional annotations.

  utility_tools:
    # PubMed availability check
    check_pubmed:
      server: "default_pubmed"
      mcp_tool_name: "check_pubmed_available"
      display_name: "Check PubMed Availability"
      description: "Check if PubMed API is accessible via the MCP server"
      category: "utility"
      enabled: true

      response_format:
        type: "boolean_string"

# Workflow Configurations
# Define which tools are available in each phase of hypothesis generation
workflows:
  # Literature review phase - comprehensive paper analysis
  literature_review:
    search_sources:
      # The group's own papers are searched alongside the public databases.
      # Listed first so their passages lead the deduplicated corpus: on a
      # question the group has already published on, their own result is the
      # one that should anchor the review.
      - tool: "paper_corpus_search"
        papers_per_query: 4
        enabled: true
      - tool: "pubmed_fulltext"
        papers_per_query: 4
        enabled: true
      - tool: "openalex_search"
        papers_per_query: 4
        enabled: true
    deduplicate_across_sources: true
    context_enrichment_tools:
      - "chembl_search"
      - "uniprot_search"
    availability_check: "check_pubmed"

  # Draft generation phase - quick metadata searches for ideation
  draft_generation:
    search_tools:
      - "pubmed_search"
      - "paper_corpus_search"
      - "paper_corpus_fetch"

  # Validation phase - fulltext searches for novelty checking
  validation:
    search_tools:
      - "pubmed_fulltext"
      - "openalex_search"
      - "paper_corpus_search"
      - "paper_corpus_fetch"

  reflection:
    search_tools:
      - "pubmed_fulltext"
      - "openalex_search"
      - "chembl_search"
      - "uniprot_search"
      - "paper_corpus_search"
      - "paper_corpus_fetch"

# Global Settings
settings:
  # How to merge user config with defaults:
  # - override: user values replace defaults for matching keys
  # - extend: user values add to defaults
  # - replace: user config completely replaces defaults
  merge_strategy: "override"
