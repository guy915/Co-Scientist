# Web-first research configuration
# Version 1.0
#
# Makes the open web a first-class literature-review source rather than only
# a tool the agent may reach for during drafting and reflection.
#
# Use this for domains with no strong academic index (policy, industry
# analysis, security advisories, emerging technology) or when recency matters
# more than peer review. For biomedical work, prefer the default config,
# which keeps PubMed and OpenAlex as the grounding sources and still exposes
# web_search and read_url to the agentic phases.
#
# Requirements:
# - BRAVE_API_KEY or TAVILY_API_KEY set on the MCP server. Without one the
#   server does not register search_web and this config has no search source.

version: "1.0"

servers:
  default_pubmed:
    url: "${MCP_SERVER_URL:-http://localhost:8888/mcp}"
    transport: "streamable_http"
    enabled: true

workflows:
  literature_review:
    search_sources:
      - tool: "web_search"
        papers_per_query: 6
        enabled: true
        # Web results carry a snippet, not full text. Fetch the page so the
        # analysis phase has something substantial to reason over.
        content_tool: "read_url"
        content_url_field: "url"

      # Keep OpenAlex alongside the web so peer-reviewed work still surfaces
      # where it exists. Drop this entry for a purely web-grounded run.
      - tool: "openalex_search"
        papers_per_query: 4
        enabled: true

    deduplicate_across_sources: true

    # The default is "boolean", which emits PubMed AND/OR/NOT syntax. Web
    # engines AND every token in a query like that and return nothing.
    query_format: "natural_language"

    # No PubMed in this config, so there is no PubMed availability probe to
    # run. Leaving the default here would gate the whole node on a service
    # this config never uses.
    availability_check: null

    content_tool: "read_url"
    content_url_field: "url"

    read_tools:
      - "read_url"

  # Agentic path: with tool-calling generation enabled, the model searches
  # the web and reads pages itself during drafting.
  draft_generation:
    search_tools:
      - "web_search"
      - "openalex_search"
    read_tools:
      - "read_url"

  # Novelty checks run as a direct call against the first search tool, so
  # web_search leads here to check novelty against the open web.
  validation:
    search_tools:
      - "web_search"
      - "openalex_search"

  # Reflection is an entity-based knowledge-graph lookup and does not use
  # free-text web search; OpenAlex covers the academic side.
  reflection:
    search_tools:
      - "openalex_search"

settings:
  # "override" keeps the tool definitions from the default tools.yaml (which
  # already defines web_search and read_url) and replaces only the workflow
  # wiring above.
  merge_strategy: "override"
