[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "co-scientist-viewer"
version = "0.1.0"
description = "Web application for running and monitoring the AI Co-Scientist multi-agent research system. Provides real-time tracking of hypothesis generation, review, ranking, evolution, and iterations."
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]

dependencies = [
    "fastapi>=0.142.2,<1",
    "starlette>=1.3.1,<2",
    "uvicorn>=0.24.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    # Citation fetching uses httpx directly; FastAPI does not supply it transitively.
    "httpx>=0.25.0",
    "python-multipart>=0.0.9",
    "pypdf>=5.0.0,<7.0.0",
    # Run credentials require cryptography for encryption at rest.
    "cryptography>=43.0.0",
    # Error reports stay off unless SENTRY_DSN is set.
    "sentry-sdk>=2.0.0,<3",
    # Traces stay off unless OTEL_EXPORTER_OTLP_ENDPOINT is set.
    "opentelemetry-sdk>=1.30,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
    "co-scientist-engine>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=7.0",
    "ruff==0.15.21",  # pinned: must match the ruff pin in .github/workflows/ci.yml
    "mypy>=1.5.0",
    "httpx>=0.25.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
app = ["py.typed", "content/*.md"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[tool.pixi.tasks]
dev = "python -m uvicorn app.main:app --reload --reload-dir app --host 0.0.0.0 --port 8008"
start = "python -m uvicorn app.main:app --host 0.0.0.0 --port 8008"
test = "pytest"
format = "ruff format app tests"
lint = "ruff check app tests"
typecheck = "mypy ."

[tool.pixi.dependencies]
python = ">=3.10,<3.13"

[tool.pixi.pypi-dependencies]
co-scientist-viewer = { path = ".", editable = true }

[tool.pixi.environments]
default = { features = ["dev"], solve-group = "default" }

[tool.ruff]
line-length = 100
target-version = "py310"
# Published abstract fixtures are verbatim corpus data; formatting must not rewrite them.
extend-exclude = ["dev"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
    "C90", # mccabe (cyclomatic complexity)
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
# Load dotenv before importing environment-dependent settings.
"app/main.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["^(dev|build|dist)/"]

[[tool.mypy.overrides]]
module = ["pypdf", "pypdf.*"]
ignore_missing_imports = true

# Following imports can bypass exclusions; do not typecheck offline docling internals.
[[tool.mypy.overrides]]
module = ["dev.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
