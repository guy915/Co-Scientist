[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "co-scientist-viewer"
version = "0.1.0"
description = "Web application for running and monitoring the AI Co-Scientist multi-agent research system. Provides real-time tracking of hypothesis generation, review, ranking, evolution, and iterations."
requires-python = ">=3.10"

dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    # Runtime dep of the `cosci` CLI (app.cli), which drives the API over
    # HTTP. FastAPI does not pull httpx in, so a bare install would expose the
    # entry point but fail to import it without this pin.
    "httpx>=0.25.0",
    "python-multipart>=0.0.9",
    "pypdf>=5.0.0,<7.0.0",
    "co-scientist-engine>=0.2.0"
]

# Console entry point: `cosci` drives Co-Scientist runs via the app's HTTP API.
[project.scripts]
cosci = "app.cli.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=7.0",
    "ruff>=0.15",
    "mypy>=1.5.0",
    "httpx>=0.25.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
app = ["py.typed", "content/*.md"]

# Pixi-specific configuration (https://pixi.sh)
# Pixi reads [project.dependencies] and [project.optional-dependencies] above automatically.
# Only pixi-specific overrides and extras go here.
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[tool.pixi.tasks]
dev = "python -m uvicorn app.main:app --reload --reload-dir app --host 0.0.0.0 --port 8008"
start = "python -m uvicorn app.main:app --host 0.0.0.0 --port 8008"
test = "pytest"
format = "ruff format app tests"
lint = "ruff check app tests"
typecheck = "mypy ."

[tool.pixi.dependencies]
python = ">=3.10,<3.13"

[tool.pixi.pypi-dependencies]
co-scientist-viewer = { path = ".", editable = true }

[tool.pixi.environments]
default = { features = ["dev"], solve-group = "default" }

[tool.ruff]
line-length = 80
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
    "D",   # pydocstyle
]
ignore = [
    # Google-style docstrings use descriptive-mood summaries ("Returns the
    # ...", "Fetches rows ..."), which the imperative-mood check rejects.
    "D401",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests are not public API; their names are self-describing, so
# docstrings are not required.
"tests/**" = ["D1"]
# main.py must call load_dotenv() before importing app.config (and any
# module that reads settings at import time), because pydantic-settings
# reads os.environ when Settings() is constructed. The env-dependent
# imports therefore intentionally sit below that call, so E402 is
# expected here rather than a mistake to reorder away.
"app/main.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["co_scientist", "co_scientist.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["pypdf", "pypdf.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
