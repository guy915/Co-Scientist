services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: coscientist-api
    env_file:
      - .env
    ports:
      - "8008:8008"
    environment:
      - MCP_SERVER_URL=http://mcp:8888/mcp
      # optional inner control alongside network placement (N7); unset by
      # default, which reproduces the MCP server's historical no-auth
      # behavior. set the same value here and on the mcp service's
      # COSCIENTIST_MCP_SHARED_SECRET (in app/.env) to require it.
      - COSCIENTIST_MCP_SHARED_SECRET=${COSCIENTIST_MCP_SHARED_SECRET:-}
      - COSCIENTIST_CACHE_DIR=/app/cache
      # The DB otherwise defaults to a path inside the container's own
      # writable layer, which `docker compose up --build` (or any container
      # recreation) discards silently -- every durable run gone with no
      # error. Paired with the ./data bind mount below (N28).
      - COSCIENTIST_DB_PATH=/app/data/coscientist.db
      # Override to clone a different fork/branch of the engine instead of
      # mounting the local checkout below (the default, and the only path
      # that is actually reproducible -- a clone re-resolves COSCIENTIST_ENGINE_REF
      # on every container recreation, so "main" is deliberately floating
      # for this opt-in workflow; pin a commit SHA here for a reproducible
      # clone (N28)).
      - COSCIENTIST_ENGINE_REPO=
      - COSCIENTIST_ENGINE_REF=main
      # engine is mounted at /workspace/co-scientist-engine. Falls back to
      # the reference domain example (INDRA + PubMed) but reads TOOLS_CONFIG
      # from .env first, so `TOOLS_CONFIG=` in app/.env now actually wins
      # instead of being silently overridden by this hardcoded default
      # (N28) -- compose resolves ${VAR:-default} from the top-level .env
      # it reads for variable substitution, the same file app/.env is
      # symlinked to at the repo root (see Makefile).
      - TOOLS_CONFIG=${TOOLS_CONFIG:-/workspace/co-scientist-engine/src/co_scientist/config/examples/indra_cancer.yaml}
    volumes:
      - ./data:/app/data
      - ./cache:/app/cache
      - ./app:/app/app
      # mount local engine checkout; entrypoint can clone if COSCIENTIST_ENGINE_REPO is set
      - ${COSCIENTIST_ENGINE_PATH:-../engine}:/workspace/co-scientist-engine
    depends_on:
      mcp:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8008/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  ui:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: coscientist-ui
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - ./frontend/tsconfig.json:/app/tsconfig.json
    environment:
      - NODE_ENV=development
    restart: unless-stopped

  mcp:
    build:
      context: ${COSCIENTIST_ENGINE_PATH:-../engine}
      dockerfile: mcp_server/Dockerfile
    container_name: coscientist-mcp
    ports:
      - "8888:8888"
    environment:
      - COSCIENTIST_MCP_PORT=8888
      # must match the api service's COSCIENTIST_MCP_SHARED_SECRET above,
      # or leave both unset (the default) for no auth check (N7).
      - COSCIENTIST_MCP_SHARED_SECRET=${COSCIENTIST_MCP_SHARED_SECRET:-}
      # set ENTREZ_EMAIL here (or in .env) for PubMed access; server degrades gracefully without it
      # - ENTREZ_EMAIL=you@example.com
    volumes:
      - ${COSCIENTIST_ENGINE_PATH:-../engine}/mcp_server/paper_cache:/app/mcp_server/paper_cache
      - ${COSCIENTIST_ENGINE_PATH:-../engine}/mcp_server:/app/mcp_server
    # --reload is a deliberate dev-only trade-off (matches `make dev-api`'s
    # own --reload for the api service, entrypoint.sh): restarting on every
    # edit under mcp_server/ can drop an in-flight literature-review call
    # the same way editing app/ mid-run drops the api's embedded worker
    # cohort (see AGENTS.md Gotchas, "Startup work runs before uvicorn
    # binds a port"). Accepted here for hot-reload dev UX; do not carry
    # --reload into either production Dockerfile.
    command: >
      uvicorn mcp_server.server:app
      --host 0.0.0.0
      --port 8888
      --reload
      --reload-dir mcp_server
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8888', timeout=5.0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
