roblem:"Undiscovered public knowledge is exactly what a comprehensive review surfaces incidentally and then drops, because no agent is looking for it.",origin:"extension"},{id:"full-text-access",label:"Credentialed retrieval",cluster:"knowledge",summary:"Retrieve through the institution's own subscriptions so the system reads the full text its user is already entitled to read.",problem:"Retrieval reaches only what is openly published, so the system reasons over abstracts while the scientist beside it reads the paper. What it cites is then the evidence that happened to be free, not the evidence that settles the question.",origin:"extension"},{id:"experiment-stage",label:"Experiment protocols",cluster:"capabilities",summary:"A dedicated stage after ranking that turns a hypothesis into a bench-ready protocol.",problem:"The paper claims to provide experimental protocols, but the examples are high-level outlines — assay classes and concentration ranges, not something a postdoc can run.",source:"p. 4",origin:"critique"},{id:"bio-simulation",label:"Bio simulation tools",cluster:"capabilities",summary:"Give agents tool access to domain models for structure and interaction prediction — the ready-made route being DeepMind's Antigravity Science Skills bundle, which packages AlphaFold, AlphaGenome, Foldseek, PyMOL and the sequence, variant and compound databases as agent-callable skills.",problem:"Hypotheses about physical systems are evaluated purely on textual plausibility, with no check against the models that could falsify them cheaply.",source:"App. A.6",origin:"critique"},{id:"multimodal",label:"Multimodal I/O",cluster:"capabilities",summary:"Parse papers into markdown with figures extracted and captioned, and produce structured visual output.",problem:"The paper flags weak reasoning over figures and charts. A large share of a paper's actual evidence lives in its figures, and text-only ingestion discards it.",source:"p. 27",origin:"critique"},{id:"model-fusion",label:"Mod
