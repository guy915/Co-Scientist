# Keep browser libraries with the matching driver; no apt or browser downloads.
name: Cross-browser keyboard guards

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# A distinct namespace cannot cancel the calling CI workflow.
concurrency:
  group: cross-browser-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  keyboard:
    name: Keyboard guards (${{ matrix.project }}, ${{ matrix.shard }}/2)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble@sha256:cf0daee9b994042e011bc29f20cdff1a9f682a039b43fcd738f7d8a9d3bcd9d6
      options: --shm-size=1g
    strategy:
      fail-fast: false
      matrix:
        project: [webkit, webkit-iphone, firefox]
        shard: [1, 2]
    env:
      COSCI_E2E_PRODUCTION: '1'
      LITELLM_LOCAL_MODEL_COST_MAP: 'True'
      PYTHON_DOTENV_DISABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.11.32'
          enable-cache: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
      - name: Install checksum-verified Bun without system zip tools
        run: |
          python scripts/ci/install_tools.py bun "$RUNNER_TEMP/ci-tools"
          ln -s bun "$RUNNER_TEMP/ci-tools/bunx"
          echo "$RUNNER_TEMP/ci-tools" >> "$GITHUB_PATH"
          test "$("$RUNNER_TEMP/ci-tools/bun" --version)" = '1.3.14'
      - name: Build backend venv and frontend dependencies
        run: |
          uv venv --python "$(command -v python)" --no-python-downloads .venv
          uv pip install --python .venv/bin/python -e "engine[dev]"
          cd app/frontend
          bun install --frozen-lockfile
      - name: Install frozen browser test dependencies
        working-directory: e2e
        run: bun install --frozen-lockfile
      - name: Require the image to match the installed browser driver
        run: |
          node - <<'JS'
          const actual = require('./e2e/node_modules/@playwright/test/package.json').version;
          if (actual !== '1.61.1') {
            throw new Error(`Playwright ${actual} needs a matching pinned container image`);
          }
          JS
      - name: Match the ephemeral container home to the job user
        run: |
          python - <<'PY'
          import os
          import stat
          from pathlib import Path

          home = Path.home()
          before = home.lstat()
          if not stat.S_ISDIR(before.st_mode):
              raise SystemExit('The mounted job home must be a directory')
          os.chown(home, os.getuid(), os.getgid())
          if home.stat().st_uid != os.getuid():
              raise SystemExit('The browser job must own its home directory')
          print(f'Job home ownership: {before.st_uid} -> {os.getuid()}')
          PY
      - name: Run keyboard guards through the isolated browser runner
        env:
          KEYBOARD_PROJECT: ${{ matrix.project }}
          KEYBOARD_SHARD: ${{ matrix.shard }}
        run: node e2e/run.mjs --config playwright.cross-browser.config.ts --project="$KEYBOARD_PROJECT" --shard="$KEYBOARD_SHARD/2"
      - name: Preserve browser report and failure diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cross-browser-${{ matrix.project }}-${{ matrix.shard }}
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
          if-no-files-found: warn
