# Live provider evaluation is opt-in; presubmit never receives model secrets.
name: Decision bake-off

on:
  workflow_dispatch:
    inputs:
      site:
        description: Call site to evaluate
        type: choice
        options: [all, literature_relevance, ranking_pairwise, proximity, semantic_safety]
        default: all
      cases:
        description: Cases per site (5 for initial smoke, 150 for calibration and holdout)
        type: choice
        options: ['5', '150']
        default: '5'
      delay:
        description: Gap between requests in seconds (30 for large free Liquid batches)
        type: choice
        options: ['4', '30']
        default: '30'
      quota_diagnostics:
        description: Make one Liquid-only relevance request and export sanitized quota metadata
        type: boolean
        default: false
      source_runs:
        description: Completed real-backend Benchmark run IDs, comma separated
        type: string
        default: '37638093312,37619174808,37598146898,37572259558,37566987457,37558737903,37558735897'

permissions:
  contents: read
  actions: read

concurrency:
  group: decision-bakeoff
  cancel-in-progress: false

jobs:
  evaluate:
    name: Decision bake-off (${{ matrix.site }})
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        site: ${{ fromJSON(inputs.quota_diagnostics && '["literature_relevance"]' || inputs.site == 'literature_relevance' && '["literature_relevance"]' || inputs.site == 'ranking_pairwise' && '["ranking_pairwise"]' || inputs.site == 'proximity' && '["proximity"]' || inputs.site == 'semantic_safety' && '["semantic_safety"]' || '["literature_relevance","ranking_pairwise","proximity","semantic_safety"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up backend
        uses: ./.github/actions/setup-backend
      - name: Download recorded research inputs
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUNS: ${{ inputs.source_runs }}
        run: |
          IFS=',' read -ra runs <<< "$SOURCE_RUNS"
          if [ "${#runs[@]}" -gt 10 ]; then exit 1; fi
          for source_run in "${runs[@]}"; do
            if [[ ! "$source_run" =~ ^[0-9]+$ ]]; then exit 1; fi
            gh run download "$source_run" --dir "recorded-inputs/$source_run"
          done
      - name: Compare current free LLM with Liquid d1 free
        env:
          LIQUID_API_KEY: ${{ secrets.LIQUID_API_KEY }}
          OPENROUTER_API_KEY: ${{ !inputs.quota_diagnostics && secrets.OPENROUTER_API_KEY || '' }}
          MODEL_NAME: openrouter/inclusionai/ling-3.1-flash
          COSCIENTIST_REQUIRE_FREE_MODELS: '1'
          PYTHON_DOTENV_DISABLED: '1'
          COSCIENTIST_DB_PATH: decision-artifacts/admission.db
          DECISION_ENABLED: 'true'
          DECISION_MODEL_NAME: d1:free
          DECISION_MAX_CALLS_PER_DAY: '512'
          DECISION_MAX_TOKENS_PER_DAY: '32000000'
          SITE: ${{ matrix.site }}
          CASES: ${{ inputs.cases }}
          REQUEST_DELAY: ${{ inputs.delay }}
          QUOTA_DIAGNOSTICS: ${{ inputs.quota_diagnostics }}
        run: |
          extra_args=()
          if [ "$QUOTA_DIAGNOSTICS" = "true" ]; then
            extra_args+=(--quota-diagnostics)
          fi
          python -m evaluations.decision_bakeoff --site "$SITE" \
            --corpus recorded-inputs --cases "$CASES" --delay "$REQUEST_DELAY" \
            --output "decision-artifacts/$SITE.json" "${extra_args[@]}"
      - name: Upload decision report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: decision-bakeoff-${{ matrix.site }}
          path: decision-artifacts/*.json
          retention-days: 14
          if-no-files-found: warn
