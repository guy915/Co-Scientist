# CI is hermetic: no external network, model keys, or retry masking.
# Main retains comprehensive results for every commit; PR jobs are filtered.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

# Private repositories require pull-requests: read for paths-filter to list changed files.
permissions:
  contents: read
  pull-requests: read

# Never cancel main runs: complete per-commit results allow culprit isolation.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Filter jobs rather than workflow triggers so skipped jobs still satisfy required checks.
  changes:
    name: Affected targets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      engine: ${{ steps.filter.outputs.engine || steps.all.outputs.engine }}
      app: ${{ steps.filter.outputs.app || steps.all.outputs.app }}
      frontend: >-
        ${{ steps.filter.outputs.frontend || steps.all.outputs.frontend }}
      evaluations: >-
        ${{ steps.filter.outputs.evaluations || steps.all.outputs.evaluations }}
      mcp_server: >-
        ${{ steps.filter.outputs.mcp_server || steps.all.outputs.mcp_server }}
      e2e: ${{ steps.filter.outputs.e2e || steps.all.outputs.e2e }}
      docker: ${{ steps.filter.outputs.docker || steps.all.outputs.docker }}
      root_config: >-
        ${{ steps.filter.outputs.root_config || steps.all.outputs.root_config }}
    steps:
      - name: Checkout
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Detect changed paths (presubmit only)
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # App imports the engine.
          filters: |
            engine:
              - 'engine/**'
              - '.ruff.toml'
              - '.github/actions/**'
              - '.github/workflows/ci.yml'
            mcp_server:
              - 'engine/mcp_server/**'
              - '.ruff.toml'
              - '.github/workflows/ci.yml'
            app:
              - '.github/actions/**'
              - '.github/ci_shard.py'
              - '.ruff.toml'
              # Patterns are OR'd, so a lone negation would match every path
              # outside the frontend; list the backend paths instead.
              - 'app/*'
              - 'app/app/**'
              - 'app/tests/**'
              - 'app/dev/**'
              - 'app/docker/**'
              - 'engine/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'app/frontend/**'
              - '.github/workflows/ci.yml'
            evaluations:
              - '**/*.py'
              - '**/*.ts'
              - '**/*.tsx'
              - '**/*.css'
              - '**/*.md'
              - '.github/actions/**'
              - '.ruff.toml'
              - 'evaluations/**'
              - 'docs/**'
              - 'app/**'
              - 'engine/**'
              - 'e2e/**'
              - '.github/workflows/ci.yml'
            e2e:
              - 'Makefile'
              # The browser suite drives the full stack, so any backend,
              # frontend, engine, or harness change re-runs it. app/** already
              # covers app/frontend/**.
              - 'e2e/**'
              - 'app/**'
              - 'engine/**'
              - '.github/workflows/ci.yml'
            # Root Dockerfiles/compose are their own filter (a Docker-only
            # smoke, not the granular per-tree suites): editing them changes
            # nothing those suites would run, but should still build.
            docker:
              - 'Dockerfile.*'
              - '.dockerignore'
              - 'requirements/**'
              - 'vendor/**'
              - 'LICENSE'
              - 'NOTICE'
              - 'engine/pyproject.toml'
              - 'engine/LICENSE'
              - 'engine/NOTICE'
              - 'engine/src/**'
              - 'engine/.dockerignore'
              - 'engine/mcp_server/**'
              - 'app/app/**'
              - 'app/pyproject.toml'
              - 'app/LICENSE'
              - 'app/NOTICE'
              - 'app/requirements-app.txt'
              - 'app/.dockerignore'
              - 'app/docker/**'
              - 'app/docker-compose.yml'
              - 'app/frontend/Dockerfile'
              - 'app/frontend/.dockerignore'
              - 'app/frontend/package.json'
              - 'app/frontend/bun.lock'
              - 'app/.env.example'
              - '.github/workflows/ci.yml'
            root_config:
              - 'Makefile'
              - 'vercel.json'
              - '.env.example'
              - 'app/.env.example'
              - '.ruff.toml'
              - '.github/actions/**'
              - '.github/workflows/ci.yml'
      - name: Select all targets (postsubmit / nightly)
        id: all
        if: github.event_name != 'pull_request'
        run: |
          for target in engine app frontend evaluations mcp_server e2e \
            docker root_config; do
            echo "${target}=true" >> "$GITHUB_OUTPUT"
          done

  format-lint:
    name: Format and lint (ruff)
    needs: changes
    if: >-
      needs.changes.outputs.engine == 'true' ||
      needs.changes.outputs.app == 'true' ||
      needs.changes.outputs.evaluations == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install ruff
        # Pin formatters so unrelated releases cannot change formatting checks.
        run: python -m pip install ruff==0.15.21
      - name: Check formatting (engine)
        working-directory: engine
        run: python -m ruff format --check .
      - name: Lint (engine)
        working-directory: engine
        run: python -m ruff check .
      - name: Check formatting (app)
        working-directory: app
        run: python -m ruff format --check app tests
      - name: Lint (app)
        working-directory: app
        run: python -m ruff check app tests
      - name: Check formatting (evaluations)
        run: python -m ruff format --check evaluations
      - name: Lint (evaluations)
        run: python -m ruff check evaluations

  typecheck:
    name: Typecheck (mypy, strict)
    needs: changes
    if: >-
      needs.changes.outputs.engine == 'true' ||
      needs.changes.outputs.app == 'true' ||
      needs.changes.outputs.evaluations == 'true' ||
      needs.changes.outputs.root_config == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up backend
        uses: ./.github/actions/setup-backend
      - name: Typecheck app, engine and evaluations
        # The Makefile recipe itself, so root-config need not run mypy again.
        run: make typecheck PY=python

  test-engine:
    name: Engine tests (py${{ matrix.python-version }})
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Keep both interpreter results visible when one fails.
      fail-fast: false
      matrix:
        # Python 3.10 is the engine support floor; 3.12 is the primary runtime.
        python-version: ['3.10', '3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.11.32'
          enable-cache: false
      - name: Install engine
        run: uv pip install --system -e "engine[dev]"
      - name: Run engine test suite
        working-directory: engine
        run: python -m pytest -q

  test-app:
    name: App tests (shard ${{ matrix.shard }}/3)
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up backend
        uses: ./.github/actions/setup-backend
      - name: Run viewer backend test suite
        working-directory: app
        # Tests isolate their stores, so shards and xdist workers share nothing; four
        # workers oversubscribe the runner because many tests wait on worker polls.
        env:
          PYTHONPATH: ${{ github.workspace }}/.github
          CI_SHARD_INDEX: ${{ matrix.shard }}
          CI_SHARD_TOTAL: 3
        run: python -m pytest -q -n 4 -p ci_shard

  evaluations:
    name: Evaluations (tests + offline smoke)
    needs: changes
    if: needs.changes.outputs.evaluations == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up backend
        uses: ./.github/actions/setup-backend
      - name: Evaluation harness tests
        run: python -m pytest evaluations/tests -q
      - name: Offline evaluation smoke suite
        run: python -m evaluations.smoke

  frontend:
    name: Frontend (lint + test + build)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'
      - name: Cache bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('app/frontend/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint (gts)
        run: bun run lint
      - name: Test (vitest)
        run: bun run test
      - name: Build (tsc + vite + prerender)
        run: bun run build

  mcp-server:
    name: MCP server tests
    needs: changes
    if: needs.changes.outputs.mcp_server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.11.32'
          enable-cache: false
      - name: Install MCP server
        # MCP dev extras omit mypy and the defusedxml stubs required by strict arxiv checking.
        run: uv pip install --system -e "engine/mcp_server[dev]" mypy types-defusedxml
      - name: Run MCP server test suite
        # The MCP editable install has no import map; resolve it as a directory package from
        # engine/.
        working-directory: engine
        run: python -m pytest mcp_server/tests -q
      - name: Typecheck MCP server
        # MCP has independent strict configuration; engine mypy excludes it.
        working-directory: engine/mcp_server
        run: python -m mypy .

  e2e:
    name: Browser e2e (Playwright)
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    # Setup and first-run Chromium downloads need a larger timeout than the suite itself.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.11.32'
          enable-cache: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'
      - name: Build backend venv and frontend deps
        # The harness pins the repository venv and needs frontend dependencies before
        # launching Vite. uv installs into that venv in place of its pip.
        env:
          VIRTUAL_ENV: ${{ github.workspace }}/.venv
        run: make setup PIP="uv pip"
      - name: Install Chromium with system dependencies
        # Install Chromium OS dependencies only in CI, avoiding sudo locally.
        # Install Bun dependencies first so bunx uses the pinned Playwright version.
        working-directory: e2e
        run: |
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium
      - name: Run browser e2e suite
        run: make e2e
      - name: Test production assets and anonymous ownership
        run: make e2e-production

  docker-build:
    name: Docker builds + Compose config smoke
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build api image
        run: docker build -f Dockerfile.api -t coscientist-api-ci .
      - name: Build mcp image
        run: docker build -f Dockerfile.mcp -t coscientist-mcp-ci .
      - name: Build frontend dev image
        run: docker build -t coscientist-ui-ci app/frontend
      - name: Derive app/.env from the committed example
        # Compose env_file must exist; --env-file only supplies interpolation.
        # Use the committed secret-free example in clean checkouts.
        working-directory: app
        run: cp .env.example .env
      - name: Validate docker-compose.yml
        # Compose up may clone an absent engine over the network; config validates the graph
        # offline.
        working-directory: app
        run: docker compose config --quiet

  root-config:
    name: Root config smoke (Makefile, vercel.json)
    needs: changes
    if: needs.changes.outputs.root_config == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.11.32'
          enable-cache: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'
      - name: Validate vercel.json syntax
        run: python -m json.tool vercel.json > /dev/null
      - name: make setup
        # Other jobs encode most commands directly; this gate checks the setup and lint
        # recipes, and the typecheck job runs the typecheck recipe.
        env:
          VIRTUAL_ENV: ${{ github.workspace }}/.venv
        run: make setup PIP="uv pip"
      - name: make lint
        run: make lint

  required-checks:
    name: Required checks
    if: always()
    needs:
      - changes
      - format-lint
      - typecheck
      - test-engine
      - test-app
      - evaluations
      - frontend
      - mcp-server
      - e2e
      - docker-build
      - root-config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reject failed or cancelled jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          jobs = json.loads(os.environ["RESULTS"])
          failed = [name for name, job in jobs.items()
                    if job["result"] not in {"success", "skipped"}]
          if jobs["changes"]["result"] != "success":
              failed.append("changes")
          if failed:
              print("Required checks failed: " + ", ".join(sorted(set(failed))))
              sys.exit(1)
          print("All selected checks passed.")
          PY
