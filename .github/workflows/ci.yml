# Presubmit / postsubmit pipeline.
#
# Pull requests get the blocking presubmit pass (path-filtered, superseded
# runs cancelled); pushes to main get the same pipeline as a comprehensive
# postsubmit pass (no path filters, never cancelled); nightly.yml reuses the
# whole workflow via workflow_call as the scheduled full pass.
#
# Every command below is hermetic: no external network, no API keys, no
# retries. See docs/CI.md for the design rationale and the mapping of each
# choice to the documented Google practice it reproduces.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Lets nightly.yml run this exact pipeline as its scheduled full pass.
  workflow_call:

permissions:
  contents: read

# Cancel superseded presubmit runs (a new push to the same PR obsoletes the
# in-flight result). Postsubmit runs on main are never cancelled so every
# commit keeps a complete result — that per-commit history is what makes
# culprit-finding possible.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Approximates Bazel-style affected-target selection with path filters:
  # presubmit only runs the jobs whose inputs changed. Postsubmit, nightly,
  # and manual runs skip the filter and run everything. Filtering happens at
  # the job level (not on.paths) so skipped jobs still report a "skipped"
  # conclusion, which satisfies branch-protection required checks.
  changes:
    name: Affected targets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      engine: ${{ steps.filter.outputs.engine || steps.all.outputs.engine }}
      app: ${{ steps.filter.outputs.app || steps.all.outputs.app }}
      frontend: >-
        ${{ steps.filter.outputs.frontend || steps.all.outputs.frontend }}
      evaluations: >-
        ${{ steps.filter.outputs.evaluations || steps.all.outputs.evaluations }}
      mcp_server: >-
        ${{ steps.filter.outputs.mcp_server || steps.all.outputs.mcp_server }}
      e2e: ${{ steps.filter.outputs.e2e || steps.all.outputs.e2e }}
      docker: ${{ steps.filter.outputs.docker || steps.all.outputs.docker }}
      root_config: >-
        ${{ steps.filter.outputs.root_config || steps.all.outputs.root_config }}
    steps:
      - name: Checkout
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Detect changed paths (presubmit only)
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # app depends on the engine (editable install), so engine changes
          # re-run the app suite. evaluations is nearly global because the
          # parity ledger cites evidence files across engine/, app/, and the
          # frontend, and the checker fails if any cited file disappears.
          filters: |
            engine:
              - 'engine/**'
              - '.github/workflows/ci.yml'
            mcp_server:
              - 'engine/mcp_server/**'
              # fetch_paper reads this directory straight off disk.
              - 'corpus/**'
              - '.github/workflows/ci.yml'
            app:
              - 'app/**'
              - '!app/frontend/**'
              - 'engine/**'
              # The sbi_ucd catalog/paper-corpus tests read this directory.
              - 'corpus/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'app/frontend/**'
              - '.github/workflows/ci.yml'
            evaluations:
              # docs/** (not just docs/PARITY.md): the parity checker's own
              # evidence citations can point at any test/eval file across the
              # tree, and a docs edit is exactly how a citation goes stale
              # (a row rewritten to cite a path that does not exist), so any
              # docs change gets the one job that would catch it.
              - 'evaluations/**'
              - 'docs/**'
              - 'app/**'
              - 'engine/**'
              - 'e2e/**'
              - '.github/workflows/ci.yml'
            e2e:
              # The browser suite drives the full stack, so any backend,
              # frontend, engine, or harness change re-runs it. app/** already
              # covers app/frontend/**.
              - 'e2e/**'
              - 'app/**'
              - 'engine/**'
              - '.github/workflows/ci.yml'
            # Root Dockerfiles/compose are their own filter (a Docker-only
            # smoke, not the granular per-tree suites): editing them changes
            # nothing those suites would run, but should still build.
            docker:
              - 'Dockerfile.api'
              - 'Dockerfile.mcp'
              - 'app/docker/**'
              - 'app/docker-compose.yml'
              # The compose smoke derives its env_file from this example,
              # so an edit here can break that job and nothing else.
              - 'app/.env.example'
              - '.github/workflows/ci.yml'
            # Root-level files with no dedicated job of their own. CI encodes
            # its own commands rather than shelling to make (see docs/CI.md),
            # so nothing else exercises a Makefile edit; vercel.json has no
            # build step to run in CI at all otherwise.
            root_config:
              - 'Makefile'
              - 'vercel.json'
              - '.env.example'
              - 'app/.env.example'
              - '.github/workflows/ci.yml'
      - name: Select all targets (postsubmit / nightly)
        id: all
        if: github.event_name != 'pull_request'
        run: |
          for target in engine app frontend evaluations mcp_server e2e \
            docker root_config; do
            echo "${target}=true" >> "$GITHUB_OUTPUT"
          done

  format-lint:
    name: Format and lint (ruff)
    needs: changes
    if: >-
      needs.changes.outputs.engine == 'true' ||
      needs.changes.outputs.app == 'true' ||
      needs.changes.outputs.evaluations == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Install ruff
        # Exact pin so a formatter release cannot flip presubmit red on an
        # unrelated change. Bump deliberately, together with the dev extras.
        run: python -m pip install ruff==0.15.21
      - name: Check formatting (engine)
        working-directory: engine
        run: python -m ruff format --check .
      - name: Lint (engine)
        working-directory: engine
        run: python -m ruff check .
      - name: Check formatting (app)
        working-directory: app
        run: python -m ruff format --check app tests
      - name: Lint (app)
        working-directory: app
        run: python -m ruff check app tests
      - name: Check formatting (evaluations)
        run: python -m ruff format --check evaluations
      - name: Lint (evaluations)
        run: python -m ruff check evaluations

  typecheck:
    name: Typecheck (mypy, strict)
    needs: changes
    if: >-
      needs.changes.outputs.engine == 'true' ||
      needs.changes.outputs.app == 'true' ||
      needs.changes.outputs.evaluations == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up backend
        uses: ./.github/actions/setup-backend
      - name: Typecheck engine
        working-directory: engine
        run: python -m mypy .
      - name: Typecheck app
        working-directory: app
        run: python -m mypy .
      - name: Typecheck evaluations
        working-directory: evaluations
        run: python -m mypy .

  test-engine:
    name: Engine tests (py${{ matrix.python-version }})
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Let both interpreter runs finish so a version-specific failure is
      # visible immediately instead of hidden behind a cancelled sibling.
      fail-fast: false
      matrix:
        # 3.12 is the primary interpreter across CI; 3.10 is the engine's
        # requires-python floor.
        python-version: ['3.10', '3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: engine/pyproject.toml
      - name: Install engine
        run: python -m pip install -e "engine[dev]"
      - name: Run engine test suite
        working-directory: engine
        run: python -m pytest -q

  test-app:
    name: App tests
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up backend
        uses: ./.github/actions/setup-backend
      - name: Run viewer backend test suite
        working-directory: app
        # Runs offline: CI has no model API keys, and the suite's autouse
        # isolated_db fixture forces the deterministic offline LLM backend
        # (COSCIENTIST_FORCE_OFFLINE=1) for every test.
        run: python -m pytest -q

  evaluations:
    name: Evaluations (parity + offline smoke)
    needs: changes
    if: needs.changes.outputs.evaluations == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up backend
        uses: ./.github/actions/setup-backend
      - name: Parity ledger gate
        run: python -m evaluations.parity_check
      - name: Parity checker unit tests
        run: python -m pytest evaluations/tests -q
      - name: Offline evaluation smoke suite
        run: python -m evaluations.smoke

  frontend:
    name: Frontend (lint + test + build)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Matches the version the suite was verified against locally.
          bun-version: '1.3.14'
      - name: Cache bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('app/frontend/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint (gts)
        run: bun run lint
      - name: Test (vitest)
        run: bun run test
      - name: Build (tsc + vite + prerender)
        run: bun run build

  mcp-server:
    name: MCP server tests
    needs: changes
    if: needs.changes.outputs.mcp_server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          # The reference MCP server pins Python 3.12 (requires-python floor).
          python-version: '3.12'
          cache: pip
          cache-dependency-path: engine/mcp_server/pyproject.toml
      - name: Install MCP server
        # mypy is not in the mcp_server [dev] extra, so install it alongside
        # for the typecheck step below.
        run: python -m pip install -e "engine/mcp_server[dev]" mypy
      - name: Run MCP server test suite
        # Runs from engine/ because the mcp_server editable install exposes
        # no import map; the package resolves as a plain directory package,
        # exactly how `make dev-mcp` runs it.
        working-directory: engine
        run: python -m pytest mcp_server/tests -q
      - name: Typecheck MCP server
        # Runs from mcp_server/ where its strict mypy config lives (the
        # engine's mypy config excludes this package).
        working-directory: engine/mcp_server
        run: python -m mypy .

  e2e:
    name: Browser e2e (Playwright)
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    # Generous ceiling: `make setup` builds the venv + installs frontend deps,
    # and `make e2e` downloads Chromium on first run before launching its own
    # isolated FastAPI + Vite stack against the deterministic mock provider.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            engine/pyproject.toml
            app/pyproject.toml
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Matches the frontend job and the version verified locally.
          bun-version: '1.3.14'
      - name: Build backend venv and frontend deps
        # `make setup` creates the repo-root .venv the harness pins
        # (e2e/support/paths.ts) and installs the frontend node_modules the
        # launched Vite server needs. python3.12 from setup-python backs it.
        run: make setup
      - name: Install Chromium with system dependencies
        # --with-deps also installs the OS packages Chromium needs, hardening
        # against runner-image updates that drop a shared library. Done here
        # rather than in `make e2e` so local runs never invoke sudo. bun
        # install first so bunx resolves the harness's pinned playwright
        # version, and `make e2e`'s own install steps then no-op.
        working-directory: e2e
        run: |
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium
      - name: Run browser e2e suite
        # Self-contained: installs the e2e deps + Chromium if missing, then
        # runs the headless suite against an isolated offline mock stack.
        run: make e2e

  docker-build:
    name: Docker build + Compose config smoke
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    # Both images install a full Python + apt toolchain from scratch; no
    # layer cache between presubmit runs.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build api image
        # Build-only, never pushed: this is a "does it still build" smoke,
        # not a release step (deploys stay manual, see docs/CI.md).
        run: docker build -f Dockerfile.api -t coscientist-api-ci .
      - name: Build mcp image
        run: docker build -f Dockerfile.mcp -t coscientist-mcp-ci .
      - name: Derive app/.env from the committed example
        # The api service declares `env_file: .env`, and compose refuses to
        # resolve a compose file whose env_file is missing -- app/.env is a
        # developer symlink to the gitignored root .env, so it never exists
        # in a fresh checkout and this job failed on every run. The example
        # is the committed, secret-free stand-in, which also makes the smoke
        # check that app/.env.example stays a valid compose env_file.
        # `--env-file` is not a substitute: it only feeds ${VAR} interpolation
        # and does not satisfy a service-level `env_file:` requirement.
        working-directory: app
        run: cp .env.example .env
      - name: Validate docker-compose.yml
        # Full `compose up` needs a sibling engine checkout (the entrypoint
        # clones one over the network otherwise -- see AGENTS.md's Docker
        # workflow section), which the hermetic-CI rule rules out. `config`
        # is the offline half: it resolves interpolation and validates
        # syntax/service graph without starting anything.
        working-directory: app
        run: docker compose config --quiet

  root-config:
    name: Root config smoke (Makefile, vercel.json)
    needs: changes
    if: needs.changes.outputs.root_config == 'true'
    runs-on: ubuntu-latest
    # `make setup` builds a full venv + frontend install from scratch.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            engine/pyproject.toml
            app/pyproject.toml
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'
      - name: Validate vercel.json syntax
        run: python -m json.tool vercel.json > /dev/null
      - name: make setup
        # CI's other jobs deliberately encode their own commands instead of
        # shelling to make (docs/CI.md), so this is the only job that
        # actually runs the Makefile -- a Makefile edit that breaks a target
        # (a typo'd path, a missing dependency between recipes) has no other
        # CI signal at all.
        run: make setup
      - name: make lint
        run: make lint
      - name: make typecheck
        run: make typecheck
