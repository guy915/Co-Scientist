# Not CI: a manual, live quality benchmark for docs/OPTIMIZATION.md. It calls
# the free default model with a repository secret, so it never runs on PRs.
name: Benchmark

on:
  workflow_dispatch:
    inputs:
      tier:
        description: Run size
        type: choice
        options: [express, standard]
        default: express
      label:
        description: Name for this run, e.g. baseline-1
        type: string
        required: true

permissions:
  contents: read

jobs:
  benchmark:
    name: Benchmark (${{ inputs.tier }}, ${{ inputs.label }})
    runs-on: ubuntu-latest
    # GitHub-hosted jobs stop at six hours.
    timeout-minutes: 350
    env:
      MODEL_NAME: openrouter/inclusionai/ling-3.1-flash
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      TIER: ${{ inputs.tier }}
      MCP_SERVER_URL: http://127.0.0.1:8888/mcp
      # Keep the run database for per-call and per-task analysis after the job.
      CLAIM_SUPPORT_KEEP_DB: benchmark-artifacts/run.db
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate the MCP shared secret
        run: |
          secret="$(openssl rand -hex 32)"
          echo "::add-mask::$secret"
          echo "COSCIENTIST_MCP_SHARED_SECRET=$secret" >> "$GITHUB_ENV"
      - name: Set up backend
        uses: ./.github/actions/setup-backend
      - name: Install MCP server
        run: |
          python -m venv .venv-mcp
          .venv-mcp/bin/python -m pip install -q -e engine/mcp_server
      - name: Start MCP server
        # The server resolves as a directory package from engine/. The search
        # keys go to this step only, as in production, where the api lacks them.
        working-directory: engine
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: |
          nohup ../.venv-mcp/bin/python -m uvicorn mcp_server.server:app \
            --host 127.0.0.1 --port 8888 > ../mcp.log 2>&1 &
          for _ in $(seq 60); do
            curl -fsS http://127.0.0.1:8888/ >/dev/null && exit 0
            sleep 1
          done
          cat ../mcp.log
          exit 1
      - name: Run benchmark
        run: python -m evaluations.claim_support_eval --live --tier "$TIER"
      - name: Report
        if: always()
        run: |
          for f in evaluations/results/claim-support-live-*.json; do
            [ -e "$f" ] || continue
            {
              echo '```json'
              cat "$f"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            cat "$f"
          done
          tail -n 200 mcp.log || true
      - name: Upload run database and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-${{ inputs.tier }}-${{ inputs.label }}
          path: |
            benchmark-artifacts/
            evaluations/results/claim-support-live-*.json
            mcp.log
          retention-days: 14
          if-no-files-found: warn
