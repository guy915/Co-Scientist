# Not CI: a manual, live quality benchmark; see evaluations/README.md. It calls
# the free default model with a repository secret, so it never runs on PRs.
name: Benchmark

on:
  workflow_dispatch:
    inputs:
      tier:
        description: Run size
        type: choice
        options: [express, standard]
        default: express
      goal_id:
        description: Fixed paired-quality goal
        type: choice
        options: [cell-biology, battery-materials, urban-hydrology]
        default: cell-biology
      benchmark_ref:
        description: Git ref whose research behavior is measured
        type: string
        default: main
      max_calls:
        description: Physical request ceiling (1-450, within the agreed daily remaining share)
        type: number
        default: 150
      label:
        description: Name for this run, e.g. baseline-1
        type: string
        required: true

permissions:
  contents: read

jobs:
  benchmark:
    name: Benchmark (${{ inputs.tier }}, ${{ inputs.label }})
    runs-on: ubuntu-latest
    # A hung provider call once held a run for the six-hour runner limit with no
    # result. The run step stops first, so the result check and uploads still run.
    timeout-minutes: ${{ inputs.tier == 'standard' && 270 || 150 }}
    env:
      MODEL_NAME: openrouter/inclusionai/ling-3.1-flash
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      TIER: ${{ inputs.tier }}
      GOAL_ID: ${{ inputs.goal_id }}
      MAX_CALLS: ${{ inputs.max_calls }}
      MCP_SERVER_URL: http://127.0.0.1:8888/mcp
    steps:
      - name: Checkout
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.benchmark_ref }}
          persist-credentials: false
      - name: Generate the MCP shared secret
        timeout-minutes: 1
        run: |
          secret="$(openssl rand -hex 32)"
          echo "::add-mask::$secret"
          echo "COSCIENTIST_MCP_SHARED_SECRET=$secret" >> "$GITHUB_ENV"
      - name: Set up backend
        timeout-minutes: 15
        # Standard local-action syntax is required by actionlint 1.7.12.
        uses: ./.github/actions/setup-backend # zizmor: ignore[self-repository]
      - name: Install MCP server
        timeout-minutes: 10
        run: |
          python -m venv .venv-mcp
          .venv-mcp/bin/python -m pip install -q -e engine/mcp_server
      - name: Start MCP server
        timeout-minutes: 3
        # The server resolves as a directory package from engine/. The search
        # keys go to this step only, as in production, where the api lacks them.
        working-directory: engine
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: |
          nohup ../.venv-mcp/bin/python -m uvicorn mcp_server.server:app \
            --host 127.0.0.1 --port 8888 > ../mcp.log 2>&1 &
          for _ in $(seq 60); do
            curl -fsS http://127.0.0.1:8888/ >/dev/null && exit 0
            sleep 1
          done
          cat ../mcp.log
          exit 1
      - name: Run benchmark
        # Express has taken 41 to 71 minutes and standard about 2 h 16 min.
        timeout-minutes: ${{ inputs.tier == 'standard' && 240 || 120 }}
        run: >-
          python -m evaluations.quality_benchmark --live --tier "$TIER"
          --goal-id "$GOAL_ID" --max-calls "$MAX_CALLS" --output benchmark-artifacts
      - name: Check the metric was written
        # Claims cluster within ideas, so treat the interval as a lower bound on the spread.
        if: always()
        timeout-minutes: 2
        run: |
          python - <<'PY'
          import glob, json, os, sys

          files = sorted(glob.glob("benchmark-artifacts/claim-support-live.json"))
          if not files:
              print("::error title=No benchmark metric::The run wrote no claim-support result.")
              sys.exit(1)
          report = json.load(open(files[-1]))
          rate = report.get("unsupported_claim_rate")
          n = report.get("claims_assessed")
          if rate is None:
              print(f"::error title=No benchmark metric::{files[-1]} has no unsupported_claim_rate (n={n}).")
              sys.exit(1)
          low, high = report["unsupported_claim_rate_ci95"]
          line = f"unsupported_claim_rate {rate} (n={n} claims, 95% Wilson CI {low} to {high})"
          print(line)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"**{line}**\n\n")
          PY
      - name: Report
        if: always()
        timeout-minutes: 5
        run: |
          if [ -f benchmark-artifacts/baseline.md ]; then
            cat benchmark-artifacts/baseline.md >> "$GITHUB_STEP_SUMMARY"
          fi
          for f in benchmark-artifacts/claim-support-live.json; do
            [ -e "$f" ] || continue
            {
              echo '```json'
              cat "$f"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            cat "$f"
          done
          tail -n 200 mcp.log || true
      - name: Upload run database and logs
        if: always()
        timeout-minutes: 10
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-${{ inputs.tier }}-${{ inputs.label }}
          path: |
            benchmark-artifacts/
            mcp.log
          retention-days: 14
          if-no-files-found: warn
