# Composite action: Python 3.12 (with pip cache) plus the engine + app
# editable installs. Shared by every job that needs the FastAPI backend or the
# engine importable (typecheck, test-app, evaluations), so the install recipe
# lives in one place. Requires actions/checkout to have run first.
name: Set up backend
description: Install Python 3.12 and the engine + app packages (mirrors make setup).

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: |
          engine/pyproject.toml
          app/pyproject.toml
    - name: Install backend packages
      shell: bash
      # Mirrors `make setup`: engine editable with dev extras (brings mypy +
      # type stubs), app editable without deps to skip the PyPI
      # co-scientist-engine pin, then the app runtime deps explicitly.
      run: |
        python -m pip install -e "engine[dev]"
        python -m pip install --no-deps -e app
        python -m pip install fastapi "uvicorn[standard]" python-dotenv \
          pydantic pydantic-settings httpx
