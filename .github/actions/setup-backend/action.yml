# Backend jobs share this recipe so editable engine/app installs cannot drift.
name: Set up backend
description: Install Python 3.12 and the engine + app packages (mirrors make setup).

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: |
          engine/pyproject.toml
          app/pyproject.toml
    - name: Install backend packages
      shell: bash
      # Install app without dependencies to bypass its published engine pin; requirements-
      # app.txt supplies runtime dependencies.
      run: |
        python -m pip install -e "engine[dev]"
        python -m pip install --no-deps -e app
        python -m pip install -r app/requirements-app.txt
