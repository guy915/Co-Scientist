name: Bug report
description: Something does not work as expected.
labels: ["type: bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        For security vulnerabilities, use a private advisory instead; see
        [SECURITY.md](https://github.com/guy915/Open-Co-Scientist/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Commit or release
      description: If known; for a local checkout, use git rev-parse --short HEAD.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - API or backend workflow
        - Frontend
        - MCP or literature retrieval
        - Evaluation harness
        - CI or setup
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15, Ubuntu 24.04, Windows 11 with WSL2
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Python, Node.js and Bun versions
      placeholder: Python 3.12.x, Node 22.13.x, Bun 1.3.14
  - type: dropdown
    id: backend
    attributes:
      label: Model backend
      options:
        - Offline (no provider key)
        - Real model
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where it happened
      options:
        - Local checkout
        - Hosted site (open-coscientist.com)
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and screenshots
      description: Remove API keys, tokens and personal or research data before pasting.
      render: shell
